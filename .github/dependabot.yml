# Keeps the GitHub Actions, Terraform providers and Python dev dependencies
# current. Each ecosystem opens at most a few small PRs a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    labels: [dependencies, terraform]
    commit-message:
      prefix: "chore(terraform)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
